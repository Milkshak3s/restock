# Restock catalog — the curated list of software this build manages.
# This file is compiled into the binary; rebuild after editing.
#
# Each [[app]] has:
#   id           unique, stable identifier (used for state tracking)
#   name         display name
#   description  optional one-liner
#   essential    true = preselected by "Select essentials" on a fresh machine
#   self_updating true = the app updates itself; Restock only installs it
#   exit_codes   optional { "<code>" = "<meaning>" } shown when the installer fails; when it
#                does, Restock also names programs holding files in the install folder open
#
# [app.source] — where the latest version comes from:
#   type = "github"    repo = "owner/name", asset = "<regex on asset filename>",
#                      version_regex = "<optional regex, capture group 1 = version from tag>"
#                      (set GITHUB_TOKEN to raise the API rate limit / reach private repos)
#   type = "manifest"  url = "https://.../latest.json"  -> {"version": "...", "url": "...", "sha256": "..."?}
#                      version_key / url_key / sha256_key rename those fields for third-party JSON
#   type = "redirect"  url = "<latest download link>", version_regex = "<capture group 1 = version from URL>"
#                      follows redirects until the URL matches, e.g. .../x64/1.0.9265/Setup.exe
#   type = "lastmodified"  url = "..."  version is the file's Last-Modified date (2026.10.15)
#                      for downloads that publish no version number
#   type = "proton"    url = "<proton.me/download/.../version.json>", channel = "Stable"?,
#                      platform = "windows/x64"? (multi-platform feeds), url_template = "...{version}..."?
#                      newest release in the channel, verified against the feed's SHA-512
#   type = "direct"    url = "...", version = "..."?, sha256 = "..."?  (pinned; version defaults to "latest")
#
# [app.installer] — what to do with the downloaded file:
#   type = "exe"       args = ["/S"]                       silent installer
#   type = "msi"       args = [...]                        run as msiexec /i <file> /qn /norestart <args>
#   type = "zip"       dest = "%LOCALAPPDATA%\\Programs\\x", strip_root = true|false
#   type = "portable"  dest = "...", file_name = "x.exe"?  copy a single file
#   %VARS% in dest are expanded from the environment.
#
# [app.detect] — how to find the installed version (defaults to "managed"):
#   type = "registry"  display_name = "<regex on Uninstall DisplayName>",
#                      version_regex = "<optional, capture group 1 = version from DisplayVersion>",
#                      exe = "<optional exe in the install folder>": use its embedded version instead,
#                      for installers that leave DisplayVersion stale
#   type = "file"      paths = ['<glob for the exe>', ...]  first match wins; version is read
#                      from the exe, and zip/portable updates go into that exe's folder
#   type = "managed"   Restock records the version it installed (for zip/portable)

[[app]]
id = "7zip"
name = "7-Zip"
description = "File archiver"
essential = true
source = { type = "github", repo = "ip7z/7zip", asset = '^7z\d+-x64\.exe$' }
installer = { type = "exe", args = ["/S"] }
detect = { type = "registry", display_name = '^7-Zip' }

[[app]]
id = "notepad-plus-plus"
name = "Notepad++"
description = "Text editor"
essential = true
source = { type = "github", repo = "notepad-plus-plus/notepad-plus-plus", asset = '^npp\.[\d.]+\.Installer\.x64\.exe$' }
installer = { type = "exe", args = ["/S"] }
detect = { type = "registry", display_name = '^Notepad\+\+' }

[[app]]
id = "ripgrep"
name = "ripgrep"
description = "Fast recursive grep (portable zip)"
source = { type = "github", repo = "BurntSushi/ripgrep", asset = 'x86_64-pc-windows-msvc\.zip$' }
installer = { type = "zip", dest = '%LOCALAPPDATA%\Programs\ripgrep', strip_root = true }

[[app]]
id = "vscode"
name = "Visual Studio Code"
description = "Code editor (per-user install)"
essential = true
source = { type = "manifest", url = "https://update.code.visualstudio.com/api/update/win32-x64-user/stable/latest", version_key = "productVersion", sha256_key = "sha256hash" }
installer = { type = "exe", args = ["/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/MERGETASKS=!runcode"] }
# Background updates replace Code.exe but leave the registry's DisplayVersion behind.
detect = { type = "registry", display_name = '^Microsoft Visual Studio Code \(User\)$', exe = "Code.exe" }

[[app]]
id = "pyfa"
name = "Pyfa"
description = "EVE Online fitting tool"
source = { type = "github", repo = "pyfa-org/Pyfa", asset = '^pyfa-v[\d.]+-win\.exe$' }
installer = { type = "exe", args = ["/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-"] }
detect = { type = "registry", display_name = '^pyfa version' }

[[app]]
id = "artcraft-launcher"
name = "ArtCraft Launcher"
description = "Launcher for the ArtCraft suite of open-source apps"
source = { type = "github", repo = "storytold/craft-launcher", asset = '^artcraft-launcher-[\d.]+-windows-x64\.msi$' }
installer = { type = "msi" }
detect = { type = "registry", display_name = '^ArtCraft Launcher$' }

[[app]]
id = "eve-apm-preview"
name = "EVE-APM Preview"
description = "EVE Online client thumbnails and hotkey switching (portable)"
source = { type = "github", repo = "mrmjstc/eve-apm-preview", asset = '^EVEAPMPreview-v[\d.]+\.zip$' }
# The zip holds only the exe; profiles/ is created at runtime and survives updates.
# `dest` is only used for fresh installs; existing copies are updated in place.
installer = { type = "zip", dest = '%LOCALAPPDATA%\Programs\EVEAPMPreview', strip_root = true }
detect = { type = "file", paths = [
    '%USERPROFILE%\Documents\EVEAPMPreview*\EVEAPMPreview\EVEAPMPreview.exe',
    '%LOCALAPPDATA%\Programs\EVEAPMPreview\EVEAPMPreview.exe',
] }

[[app]]
id = "brave"
name = "Brave"
description = "Web browser"
essential = true
self_updating = true
source = { type = "github", repo = "brave/brave-browser", asset = '^BraveBrowserStandaloneSilentSetup\.exe$' }
installer = { type = "exe" }
# DisplayVersion is "<chromium major>.<brave version>", e.g. 156.1.98.60.
detect = { type = "registry", display_name = '^Brave$', version_regex = '^\d+\.(\d+\.\d+\.\d+)$' }

[[app]]
id = "discord"
name = "Discord"
description = "Chat (per-user install)"
self_updating = true
source = { type = "redirect", url = "https://discord.com/api/downloads/distributions/app/installers/latest?arch=x64&channel=stable&platform=win", version_regex = '/x64/([\d.]+)/' }
installer = { type = "exe", args = ["-s"] }
detect = { type = "registry", display_name = '^Discord$' }

[[app]]
id = "steam"
name = "Steam"
description = "Game store and launcher"
self_updating = true
source = { type = "direct", url = "https://cdn.fastly.steamstatic.com/client/installer/SteamSetup.exe" }
installer = { type = "exe", args = ["/S"] }
detect = { type = "registry", display_name = '^Steam$' }

[[app]]
id = "obs-studio"
name = "OBS Studio"
description = "Screen recording and streaming"
source = { type = "github", repo = "obsproject/obs-studio", asset = '^OBS-Studio-[\d.]+-Windows-x64-Installer\.exe$' }
installer = { type = "exe", args = ["/S"] }
detect = { type = "registry", display_name = '^OBS Studio$' }
# The silent installer's own exit codes. 6 usually means the virtual camera DLL is
# loaded by a browser or chat app that has listed webcams; quit those apps fully.
exit_codes = { "3" = "Windows version not supported", "4" = "a required dependency is missing", "5" = "OBS is still running", "6" = "OBS files are in use by another app (usually the virtual camera)" }

[[app]]
id = "sysinternals"
name = "Sysinternals Suite"
description = "Process Explorer, Process Monitor, Autoruns and friends (portable, ~370 MB)"
source = { type = "lastmodified", url = "https://download.sysinternals.com/files/SysinternalsSuite.zip" }
# Flat zip of standalone tools. Close any running tools before updating.
installer = { type = "zip", dest = '%LOCALAPPDATA%\Programs\Sysinternals' }

[[app]]
id = "proton-mail"
name = "Proton Mail"
description = "Mail desktop app (per-user install)"
# Every release in the feed points at the same unversioned URL, so download the
# versioned copy that matches the Stable entry's checksum.
source = { type = "proton", url = "https://proton.me/download/mail/windows/version.json", url_template = "https://proton.me/download/mail/windows/{version}/ProtonMail-desktop.exe" }
installer = { type = "exe", args = ["--silent"] }
detect = { type = "registry", display_name = '^Proton Mail$' }

[[app]]
id = "proton-drive"
name = "Proton Drive"
description = "Drive sync app"
source = { type = "proton", url = "https://proton.me/download/drive/windows/version.json" }
# The feed's own SilentArguments.
installer = { type = "exe", args = ["/quiet", "NoAppDataCleanup=1"] }
detect = { type = "registry", display_name = '^Proton Drive$' }
exit_codes = { "1602" = "the installation was cancelled", "1618" = "another installation is already in progress" }

[[app]]
id = "proton-drive-cli"
name = "Proton Drive CLI"
description = "proton-drive command-line client (portable)"
source = { type = "proton", url = "https://proton.me/download/drive/cli/version.json", platform = "windows/x64" }
# The exe's embedded version is Bun's, not the CLI's, so Restock tracks what it installed.
installer = { type = "portable", dest = '%LOCALAPPDATA%\Programs\Proton\Drive CLI' }

[[app]]
id = "craft-proton-sync"
name = "Craft Proton Sync"
description = "Two-way sync of the ArtCraft folder with Proton Drive (portable)"
source = { type = "github", repo = "Milkshak3s/craft-proton-sync", asset = '^craft-proton-sync-[\d.]+-windows-x64-portable\.zip$' }
# Not %LOCALAPPDATA%\craft-proton-sync: that's the app's own data folder.
installer = { type = "zip", dest = '%LOCALAPPDATA%\Programs\craft-proton-sync', strip_root = true }
# The exe has no embedded version yet, so this falls back to the version Restock
# installed; it goes stale if the app's own updater replaces the exe.
detect = { type = "file", paths = ['%LOCALAPPDATA%\Programs\craft-proton-sync\craft-proton-sync.exe'] }

